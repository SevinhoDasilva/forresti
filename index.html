<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio Level Dewa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f172a;color:#fff;overflow-x:hidden}

/* LOADER */
#loader{
 position:fixed; width:100%; height:100%;
 background:#020617; display:flex; justify-content:center; align-items:center;
 z-index:9999; font-size:24px;
}

header{
 position:fixed; width:100%; top:0; padding:20px 10%;
 display:flex; justify-content:space-between;
 background:rgba(0,0,0,0.5); backdrop-filter:blur(10px);
}

section{padding:120px 10%}

.hero{
 height:100vh; display:flex; align-items:center; justify-content:center;
 flex-direction:column; text-align:center;
}

.hero h1{font-size:50px}
.hero span{color:#38bdf8}

.btn{
 margin-top:20px; padding:12px 25px;
 background:#38bdf8; border:none; border-radius:10px;
 cursor:pointer; color:#000;
}

.projects, .gallery{
 display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px;
}

.card{
 background:#1e293b; padding:20px; border-radius:15px;
 transition:0.3s;
}

.card:hover{transform:scale(1.05)}

.gallery img{width:100%; border-radius:10px}

canvas{position:fixed; top:0; left:0; z-index:-1}

footer{text-align:center;padding:30px}
</style>
</head>
<body>

<div id="loader">Loading Portfolio...</div>

<header>
<h2>Portfolio</h2>
</header>

<canvas id="bg"></canvas>

<section class="hero">
<h1>Saya <span>Nama Kamu</span></h1>
<p>Developer Profesional • UI/UX • Creative Coding</p>
<button class="btn" onclick="scrollToProjects()">Lihat Project</button>
</section>

<section id="projects">
<h2>Project</h2>
<div class="projects">
<div class="card">Website Premium</div>
<div class="card">UI Mobile App</div>
<div class="card">3D Web Experience</div>
</div>
</section>

<section>
<h2>Gallery</h2>
<div class="gallery">
<img src="https://via.placeholder.com/300">
<img src="https://via.placeholder.com/300">
<img src="https://via.placeholder.com/300">
</div>
</section>

<footer>
<p>© 2026 Level Dewa</p>
</footer>

<script>
// LOADER
window.addEventListener('load',()=>{
 document.getElementById('loader').style.display='none';
});

// SCROLL
function scrollToProjects(){
 document.getElementById('projects').scrollIntoView({behavior:'smooth'});
}

// GSAP ANIMATION
gsap.from('.hero h1',{y:80,opacity:0,duration:1});
gsap.from('.card',{scrollTrigger:'#projects',y:50,opacity:0,stagger:0.2});

// THREE JS BACKGROUND
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('bg')});
renderer.setSize(window.innerWidth, window.innerHeight);

const geometry = new THREE.TorusGeometry(10,3,16,100);
const material = new THREE.MeshBasicMaterial({color:0x38bdf8, wireframe:true});
const torus = new THREE.Mesh(geometry, material);
scene.add(torus);

camera.position.z = 30;

function animate(){
 requestAnimationFrame(animate);
 torus.rotation.x += 0.01;
 torus.rotation.y += 0.01;
 renderer.render(scene,camera);
}
animate();

// RESPONSIVE
window.addEventListener('resize',()=>{
 renderer.setSize(window.innerWidth,window.innerHeight);
 camera.aspect = window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
});
</script>

</body>
</html>
